<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predictive Maintenance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="#">
            🔧 Predictive Maintenance System
        </a>

    </div>

</nav>

<div class="container main-container">

    <div class="card">

        <h1 class="title">

            Machine Failure Prediction

        </h1>

        <p class="subtitle">

            AI Powered Predictive Maintenance using LightGBM

        </p>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6">

                    <label>Machine Type</label>

                    <select class="form-select" name="Type" required>

                        <option value="">Select</option>

                        <option value="L">Low</option>

                        <option value="M">Medium</option>

                        <option value="H">High</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label>Shift</label>

<select class="form-select" name="Shift" required>

    <option value="">Select Shift</option>

    <option value="Morning">Morning</option>

    <option value="Evening">Evening</option>

    <option value="Night">Night</option>

</select>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Day Type</label>

                    <select class="form-select" name="Day_Type" required>

                        <option value="">Select</option>

                        <option value="Weekday">Weekday</option>

                        <option value="Weekend">Weekend</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label>Air Temperature (K)</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Air_temperature_K"
                        required>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Process Temperature (K)</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Process_temperature_K"
                        required>

                </div>

                <div class="col-md-6">

                    <label>Rotational Speed (RPM)</label>

                    <input
                        type="number"
                        class="form-control"
                        name="Rotational_speed_rpm"
                        required>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Torque (Nm)</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Torque_Nm"
                        required>

                </div>

                <div class="col-md-6">

                    <label>Tool Wear (min)</label>

                    <input
                        type="number"
                        class="form-control"
                        name="Tool_wear_min"
                        required>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Ambient Temperature (°C)</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Ambient_Temperature"
                        required>

                </div>

                <div class="col-md-6">

                    <label>Load Density</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Load_Density"
                        required>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Humidity (%)</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="Humidity"
                        required>

                </div>

            </div>

            <button class="btn btn-primary">

                Predict Machine Health

            </button>

        </form>

    </div>

</div>

<div class="footer">

    Predictive Maintenance System © 2026

</div>

</body>

</html>
