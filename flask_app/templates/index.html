{% extends "base.html" %}

{% block content %}

<div class="row">

    <div class="col-md-3">

        <div class="list-group">

            <a class="list-group-item active">
                Navigation
            </a>

            <a href="/" class="list-group-item">
                Home
            </a>

            <a href="#predict" class="list-group-item">
                Predict
            </a>

        </div>

    </div>


    <div class="col-md-9">

        <h1 class="mb-4">
            Manufacturing & Automotive
            Predictive Maintenance Dashboard
        </h1>

        <div class="card mb-4">

            <div class="card-body">

                <h4>Machine Health Status</h4>

                <p>
                    Real-time prediction using
                    LightGBM and contextual IoT data.
                </p>

            </div>

        </div>


        <div class="card">

            <div class="card-header">
                Prediction Form
            </div>

            <div class="card-body">

                <form
                    action="/predict"
                    method="POST">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="air_temp"
                        placeholder="Air Temperature">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="process_temp"
                        placeholder="Process Temperature">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="rotational_speed"
                        placeholder="Rotational Speed">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="torque"
                        placeholder="Torque">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="tool_wear"
                        placeholder="Tool Wear">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="ambient_temp"
                        placeholder="Ambient Temperature">

                    <input
                        class="form-control mb-2"
                        type="number"
                        step="0.1"
                        name="load_density"
                        placeholder="Load Density">

                    <input
                        class="form-control mb-3"
                        type="number"
                        step="0.1"
                        name="humidity"
                        placeholder="Humidity">

                    <button
                        class="btn btn-primary">

                        Predict Machine Health

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
