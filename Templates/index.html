<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Predictive Maintenance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h2>Predictive Maintenance System</h2>

            <p class="mb-0">Machine Failure Prediction</p>

        </div>

        <div class="card-body">

            <form action="/predict" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Machine Type</label>

                        <select class="form-control" name="Type" required>

                            <option value="L">L</option>

                            <option value="M">M</option>

                            <option value="H">H</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Air Temperature (K)</label>

                        <input type="number" step="0.1" class="form-control" name="Air_temperature_K" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Process Temperature (K)</label>

                        <input type="number" step="0.1" class="form-control" name="Process_temperature_K" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Rotational Speed (RPM)</label>

                        <input type="number" class="form-control" name="Rotational_speed_rpm" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Torque (Nm)</label>

                        <input type="number" step="0.1" class="form-control" name="Torque_Nm" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Tool Wear (min)</label>

                        <input type="number" class="form-control" name="Tool_wear_min" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Ambient Temperature</label>

                        <input type="number" step="0.1" class="form-control" name="Ambient_Temperature" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Load Density</label>

                        <input type="number" step="0.1" class="form-control" name="Load_Density" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Humidity (%)</label>

                        <input type="number" step="0.1" class="form-control" name="Humidity" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Shift</label>

                        <select class="form-control" name="Shift">

                            <option value="Morning">Morning</option>

                            <option value="Afternoon">Afternoon</option>

                            <option value="Night">Night</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Day Type</label>

                        <select class="form-control" name="Day_Type">

                            <option value="Weekday">Weekday</option>

                            <option value="Weekend">Weekend</option>

                        </select>

                    </div>

                </div>

                <div class="text-center">

                    <button class="btn btn-success btn-lg">

                        Predict Machine Health

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
