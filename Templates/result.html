<!DOCTYPE html>
<html lang="en">

<head>

<title>Prediction Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow text-center">

<div class="card-body">

</a>

</div>

</div>

</div>

</body>

</html>
